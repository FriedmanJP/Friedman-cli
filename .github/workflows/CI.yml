name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # T0/T1/T2 — engine + contract + golden (fast; every push; 3 OS)
  engine:
    name: Engine+contract (Julia ${{ matrix.version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.12"
            os: ubuntu-latest
            arch: x64
            allow_failure: false
          - version: "1.12"
            os: macos-latest
            arch: arm64
            allow_failure: false
          - version: "1.12"
            os: windows-latest
            arch: x64
            allow_failure: false
          # Early warning for next Julia (TS-10)
          - version: "1"
            os: ubuntu-latest
            arch: x64
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies
        shell: bash
        run: |
          julia --project -e '
            using Pkg
            Pkg.rm("MacroEconometricModels")
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="2b65092421a89df34cb82c773b36117dcda11553")
            Pkg.instantiate()
          '
      - name: Mock surface vs real MEMs (TS-3 / F32)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        run: julia --project test/tools/check_mock_surface.jl
      - name: Docs generation --check (P2-6 / C028)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        run: |
          julia --project docs/generate_cli_reference.jl --check
          julia --project docs/capture_examples.jl --check
      - name: Run engine/unit tests (T0/T1/T2)
        shell: bash
        run: julia --code-coverage=user --project test/runtests.jl
      - name: Process coverage
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
        with:
          directories: src
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # T3 core — real MEMs (ubuntu every push)
  integration-core:
    name: Integration core (T3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate integration project
        run: |
          # MEMs 0.6.7 is untagged in the registry (tip 2b65092); add from git BEFORE
          # developing Friedman so compat 0.6.7 is satisfied without registry 0.6.6 cap.
          julia --project=test/integration -e '
            using Pkg
            try Pkg.rm("Friedman") catch end
            try Pkg.rm("MacroEconometricModels") catch end
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="2b65092421a89df34cb82c773b36117dcda11553")
            Pkg.develop(path=".")
            Pkg.instantiate()
          '
      - name: Run integration-core
        run: julia --project=test/integration test/integration/runtests.jl

  # T4 E2E — subprocess battery on PRs (+ push)
  e2e:
    name: E2E subprocess (T4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies
        run: |
          julia --project -e '
            using Pkg
            Pkg.rm("MacroEconometricModels")
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="2b65092421a89df34cb82c773b36117dcda11553")
            Pkg.instantiate()
          '
      - name: Run T4 E2E battery
        env:
          FRIEDMAN_E2E: "1"
          CI: "1"
        run: julia --project test/test_e2e.jl

  # Upstream early-warning radar: latest Julia + MEMs dev. Allowed to fail.
  canary:
    name: Canary — Julia latest + MEMs dev
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies (MEMs dev)
        run: |
          julia --project -e '
            using Pkg
            Pkg.rm("MacroEconometricModels")
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="dev")
            Pkg.instantiate()
          '
      - name: Run tests
        run: julia --project test/runtests.jl
