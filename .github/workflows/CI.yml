name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # T0/T1/T2 — engine + contract + golden (fast; every push; 3 OS + Julia 1.14+opt)
  engine:
    name: Engine+contract (Julia ${{ matrix.version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.13"
            os: ubuntu-latest
            arch: x64
            allow_failure: false
          - version: "1.13"
            os: macos-latest
            arch: arm64
            allow_failure: false
          - version: "1.13"
            os: windows-latest
            arch: x64
            allow_failure: false
          - version: "1.14+opt"
            os: ubuntu-latest
            arch: x64
            allow_failure: false
          - version: "1.14+opt"
            os: windows-latest
            arch: x64
            allow_failure: false
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        if: matrix.version != '1.14+opt'
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/install-juliaup@ac1bed66e8369307bff3d25a4fa3f6b85cdfcfe7 # v3.1.7
        if: matrix.version == '1.14+opt'
        with:
          channel: '1.14+opt'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies
        shell: bash
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Mock surface vs real MEMs (TS-3 / F32)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: julia --project test/tools/check_mock_surface.jl
      - name: Plot coverage drift (vs baseline)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: julia --project test/tools/check_plot_coverage.jl
      - name: Table-key drift gate (goldens)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: julia --project test/tools/check_table_keys.jl
      - name: Handle-kind drift gate
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: julia --project test/tools/check_handle_kinds.jl
      - name: Live handle round-trip CI gate (#310)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: julia --project test/tools/check_handle_roundtrips.jl
      - name: Fast-path metadata pack & thin wrapper parity (#293-#299)
        if: matrix.version == '1.13'
        shell: bash
        run: |
          julia --project test/tools/check_fastpath_pack.jl
          julia --project test/test_fastpath.jl
      - name: Docs generation --check (P2-6 / C028)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: |
          julia --project docs/generate_cli_reference.jl --check
          julia --project docs/lint_docs.jl
          julia --project docs/capture_examples.jl --check
      - name: Conformant envelope validation (schema + goldens)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        run: |
          pip install --quiet jsonschema
          python3 test/tools/validate_envelopes.py
      - name: Run engine/unit tests (T0/T1/T2)
        shell: bash
        run: julia --code-coverage=user --project test/runtests.jl
      - name: Process coverage
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
        with:
          directories: src
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.13'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # T3 core — real MEMs (ubuntu every push, Julia 1.13 & 1.14+opt)
  integration-core:
    name: Integration core (T3 / Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        version: ["1.13", "1.14+opt"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        if: matrix.version != '1.14+opt'
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/install-juliaup@ac1bed66e8369307bff3d25a4fa3f6b85cdfcfe7 # v3.1.7
        if: matrix.version == '1.14+opt'
        with:
          channel: '1.14+opt'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate integration project
        run: |
          julia --project=test/integration -e '
            using Pkg
            try Pkg.rm("Friedman") catch end
            Pkg.develop(path=".")
            Pkg.instantiate()
          '
      - name: Run integration-core
        env:
          FRDC_T3_DUMP_ENVELOPES: ${{ runner.temp }}/envelopes
        run: julia --code-coverage=user --project=test/integration test/integration/runtests.jl
      - name: Conformant envelope validation (T3 dump)
        run: |
          pip install --quiet jsonschema
          python3 test/tools/validate_envelopes.py --dump "${{ runner.temp }}/envelopes"
      - name: Table-key drift gate (T3 dump)
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project test/tools/check_table_keys.jl "${{ runner.temp }}/envelopes"
      - name: Input-schema metaschema check
        run: |
          julia --project=test/integration test/tools/dump_input_schemas.jl "${{ runner.temp }}/input_schemas"
          python3 test/tools/validate_envelopes.py --input-schemas "${{ runner.temp }}/input_schemas"
      - name: Process coverage
        if: matrix.version == '1.13'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
        with:
          directories: src
      - name: Upload coverage to Codecov
        if: matrix.version == '1.13'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # T4 E2E — subprocess battery on PRs (+ push) across Julia 1.13 & 1.14+opt
  e2e:
    name: E2E subprocess (T4 / Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        version: ["1.13", "1.14+opt"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        if: matrix.version != '1.14+opt'
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/install-juliaup@ac1bed66e8369307bff3d25a4fa3f6b85cdfcfe7 # v3.1.7
        if: matrix.version == '1.14+opt'
        with:
          channel: '1.14+opt'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Run T4 E2E battery
        env:
          FRDC_E2E: "1"
          CI: "1"
        run: julia --project test/test_e2e.jl

  # Upstream early-warning radar: latest Julia + MEMs dev. Allowed to fail.
  canary:
    name: Canary — Julia latest + MEMs dev
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install dependencies (MEMs dev)
        run: |
          julia --project -e '
            using Pkg
            Pkg.rm("MacroEconometricModels")
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="dev")
            Pkg.instantiate()
          '
      - name: Run tests
        run: julia --project test/runtests.jl
