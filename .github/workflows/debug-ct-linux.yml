# TEMPORARY diagnostic for PR #205. DELETE AFTER DIAGNOSIS (do not merge).
name: debug-ct-linux

on:
  pull_request:
  workflow_dispatch:

jobs:
  debug-ct:
    name: Debug CT repro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate integration project
        run: |
          julia --project=test/integration -e '
            using Pkg
            try Pkg.rm("Friedman") catch end
            Pkg.develop(path=".")
            Pkg.instantiate()
          '
      - name: Run CT diagnostic
        run: julia --project=test/integration test/tools/debug_ct_repro.jl
