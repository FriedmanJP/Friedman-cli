name: Release

on:
  push:
    tags:
      - 'v*'
  # W6/#141 (C074/#79): dispatch runs build + smoke + latency bench WITHOUT
  # releasing (the release job and GitHub Release upload steps are tag-guarded).
  # The budget inputs exist for the documented failure-path demonstration —
  # never lower budgets to make a red run green.
  workflow_dispatch:
    inputs:
      budget_version_ms:
        description: "fast-path metadata budget in ms (default 50)"
        required: false
        default: "50"
      budget_estimate_ms:
        description: "first estimate multivariate var budget in ms (default 3500)"
        required: false
        default: "3500"

permissions:
  contents: write

env:
  BUDGET_VERSION_MS: ${{ github.event.inputs.budget_version_ms || '50' }}
  BUDGET_ESTIMATE_MS: ${{ github.event.inputs.budget_estimate_ms || '3500' }}

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Standalone create_app() with JuMP+Ipopt. Headroom for setup+deps+build+smoke+archive.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            platform: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            arch: x64
            platform: windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VER=$(python3 -c 'import tomllib; print(tomllib.load(open("Project.toml","rb"))["version"])')
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight validate Windows MSIX packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Ver = "${{ steps.version.outputs.version }}"
          $Tmp = Join-Path $env:TEMP ("frdc-msix-preflight-" + [System.Guid]::NewGuid().ToString("N"))
          $DummyApp = Join-Path $Tmp "app"
          $SideloadMsix = Join-Path $Tmp "sideload.msix"
          $StoreMsix = Join-Path $Tmp "store.msix"
          New-Item -ItemType Directory -Path (Join-Path $DummyApp "bin") -Force | Out-Null
          try {
            # Copy a small x64 PE binary as placeholder so MakeAppx + Add-AppxPackage validate in seconds
            Copy-Item "$env:SystemRoot\System32\where.exe" (Join-Path $DummyApp "bin\frdc.exe")
            & packaging/msix/pack_msix.ps1 -AppDir $DummyApp -Version "$Ver" -OutputPath $SideloadMsix -Mode "sideload"
            & packaging/msix/pack_msix.ps1 -AppDir $DummyApp -Version "$Ver" -OutputPath $StoreMsix -Mode "store"
            $DevKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
            if (-not (Test-Path $DevKey)) { New-Item -Path $DevKey -Force | Out-Null }
            Set-ItemProperty -Path $DevKey -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord
            powershell.exe -NoProfile -Command "`$ErrorActionPreference = 'Stop'; Add-AppxPackage -Path '$SideloadMsix' -AllowUnsigned"
            if ($LASTEXITCODE -ne 0) { throw "Pre-flight Add-AppxPackage -AllowUnsigned failed ($LASTEXITCODE)" }
            $AliasExe = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\frdc.exe"
            if (-not (Test-Path $AliasExe)) { throw "Pre-flight AppExecutionAlias not created at $AliasExe" }
            Write-Host "Pre-flight MSIX packaging + Add-AppxPackage + AppExecutionAlias validation passed."
          } finally {
            powershell.exe -NoProfile -Command "Get-AppxPackage -Name 'FriedmanJP.Friedman-cli' -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue"
            Remove-Item -Path $Tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

      - uses: julia-actions/install-juliaup@ac1bed66e8369307bff3d25a4fa3f6b85cdfcfe7 # v3.1.7
        with:
          channel: '1.14+opt'

      - name: Print Julia version
        shell: bash
        run: julia --version

      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2

      - name: Install dependencies
        env:
          # PackageCompiler forces --pkgimages=no and ignores --pkgimages=yes
          # caches; skipping autoprecompile here saves 6–10 min and ~2 GiB disk.
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          # Registry MacroEconometricModels exact-pinned in Project.toml [compat]
          julia --project -e 'using Pkg; Pkg.instantiate()'

      # Swap + TMPDIR on /mnt are headroom on Linux (15 GiB RAM, ~14 GiB free on /).
      # build_release.jl bounds peak RSS via single cpu_target ("generic"),
      # -O1, include_transitive_dependencies=false, and JULIA_IMAGE_THREADS=1.
      - name: Add swap space and /mnt temp dir (Linux headroom)
        if: runner.os == 'Linux'
        run: |
          # GitHub ubuntu runners already have an active /swapfile (fallocate over it
          # fails "Text file busy"), so add ADDITIONAL swap on the large /mnt temp disk.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Put PackageCompiler's ~1.2 GB temporary -o.a archive on /mnt instead of /.
          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          swapon --show
          free -h
          df -h / /mnt

      - name: Build standalone app
        env:
          JULIA_IMAGE_THREADS: "1"
          FRDC_COMPRESS_SYSIMAGE: "true"
        run: julia build_release.jl
        timeout-minutes: 120

      - name: Package Windows MSIX (sideload + Store)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Ver = "${{ steps.version.outputs.version }}"
          & packaging/msix/pack_msix.ps1 `
            -AppDir "build\frdc" `
            -Version "$Ver" `
            -OutputPath "build\frdc-v$Ver-windows-x86_64.msix" `
            -Mode "sideload"
          & packaging/msix/pack_msix.ps1 `
            -AppDir "build\frdc" `
            -Version "$Ver" `
            -OutputPath "build\frdc-v$Ver-windows-x86_64-store.msix" `
            -Mode "store"

      - name: Smoke-test standalone Linux binary (offline, zero-Julia)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/build/frdc/bin/frdc"

          # Verify zero GPL-incompatible solver / proprietary MKL artifacts were bundled (#287, #288)
          if [ -d "$PWD/build/frdc/share/julia/artifacts" ]; then
            if find "$PWD/build/frdc/share/julia/artifacts" -maxdepth 4 \( -iname '*ipopt*' -o -iname '*mumps*' -o -iname '*pathsolver*' -o -iname '*libpath*' -o -iname '*libhsl*' -o -iname '*hsl_jll*' -o -iname '*mkl*' -o -iname '*tbb*' -o -iname '*iomp*' \) | grep -q .; then
              echo "GPL-incompatible solver or proprietary MKL/oneTBB/IntelOpenMP artifact bundled!" >&2
              exit 1
            fi
          fi

          # Fixtures
          printf 'y1,y2\n' > smoke.csv
          for t in $(seq 1 60); do printf '%s,%s\n' "$t.1" "$((t % 7)).3" >> smoke.csv; done
          cat > smoke_rbc.toml <<'EOF'
          [model]
          endogenous = ["y", "pi"]
          exogenous = ["e_a"]
          linear = true
          [model.parameters]
          rho = 0.85
          sigma = 0.02
          kappa = 0.25
          [[model.equations]]
          expr = "y[t] = rho * y[t-1] + sigma * e_a[t]"
          [[model.equations]]
          expr = "pi[t] = 0.99 * pi[t+1] + kappa * y[t]"
          EOF

          EMPTY_HOME=$(mktemp -d)
          EMPTY_DEPOT=$(mktemp -d)
          RO_DEPOT=$(mktemp -d)
          STDERR_LOG=$(mktemp)
          trap 'chmod 755 "$RO_DEPOT" 2>/dev/null || true; rm -rf "$EMPTY_HOME" "$EMPTY_DEPOT" "$RO_DEPOT" "$STDERR_LOG"' EXIT

          # Ensure julia is genuinely absent from the isolated PATH
          if env -i PATH="/usr/bin:/bin" sh -c 'command -v julia >/dev/null 2>&1'; then
            echo "Unexpected julia binary found on /usr/bin:/bin" >&2
            exit 1
          fi

          # Run under default user env (NO JULIA_OBJCACHE override — friedman_driver.c defaults it to 0)
          run_isolated() {
            env -i \
              PATH="/usr/bin:/bin" \
              HOME="$EMPTY_HOME" \
              JULIA_DEPOT_PATH="$EMPTY_DEPOT" \
              JULIA_PKG_OFFLINE="true" \
              "$@"
          }

          # Verify two-binary fastpath layout exists (#296)
          test -x "$PWD/build/frdc/bin/frdc-core" || { echo "Missing build/frdc/bin/frdc-core" >&2; exit 1; }
          test -s "$PWD/build/frdc/share/frdc/cli_cache.bin" || { echo "Missing cli_cache.bin" >&2; exit 1; }

          # --version / --help / schema --docs / data list / io sources (fast path + FRDC_NO_FASTPATH=1)
          run_isolated "$BIN" --version > ver_fp.txt 2> ver_err.txt
          test ! -s ver_err.txt || { echo "Unexpected stderr from fast --version:"; cat ver_err.txt >&2; exit 1; }
          run_isolated env FRDC_NO_FASTPATH=1 "$BIN" --version > ver_core.txt 2> ver_core_err.txt
          test ! -s ver_core_err.txt || { echo "Unexpected stderr from core --version:"; cat ver_core_err.txt >&2; exit 1; }
          diff -u ver_fp.txt ver_core.txt
          run_isolated "$BIN" --help > help_fp.txt 2> help_err.txt
          test ! -s help_err.txt || { echo "Unexpected stderr from fast --help:"; cat help_err.txt >&2; exit 1; }
          run_isolated env FRDC_NO_FASTPATH=1 "$BIN" --help > help_core.txt 2> help_core_err.txt
          test ! -s help_core_err.txt || { echo "Unexpected stderr from core --help:"; cat help_core_err.txt >&2; exit 1; }
          diff -u help_fp.txt help_core.txt
          run_isolated "$BIN" schema --docs > schema_docs.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from schema --docs:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; d=json.load(open('schema_docs.json')); assert 'docs' in d and len(d['docs'])>100"
          run_isolated "$BIN" data list --format json > dl_fp.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from data list:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; d=json.load(open('dl_fp.json')); assert d.get('status')=='ok' and 'available_datasets' in d['data']"
          run_isolated "$BIN" io sources --format json > ios_fp.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from io sources:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; d=json.load(open('ios_fp.json')); assert d.get('status')=='ok' and 'io_mrio_sources' in d['data']"

          # Hard gate: exactly one JSON document (no ::warning fallback)
          run_isolated "$BIN" --quiet estimate multivariate var smoke.csv --lags 1 --format json > smoke_out.json 2>> "$STDERR_LOG"
          python3 - <<'PY'
          import json
          raw = open("smoke_out.json").read().strip()
          assert raw, "empty stdout"
          decoder = json.JSONDecoder()
          obj, idx = decoder.raw_decode(raw)
          assert raw[idx:].strip() == "", f"trailing garbage after JSON: {raw[idx:]!r}"
          assert obj.get("status") == "ok" or obj.get("schema_version") == 1
          print("json hard gate ok")
          PY

          # schema & completions (must emit zero stderr)
          run_isolated "$BIN" schema estimate multivariate var > schema_out.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from schema:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; json.load(open('schema_out.json')); print('schema json ok')"
          run_isolated "$BIN" completions bash > comp_bash.sh 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from completions:"; cat step_err.txt >&2; exit 1; }
          test -s comp_bash.sh

          # Bundled example datasets (:denmark, :wiot) & non-"nothing" mems_version
          run_isolated "$BIN" --quiet data describe :denmark --format json > denmark_out.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from :denmark:"; cat step_err.txt >&2; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open("denmark_out.json"))
          assert d.get("status") == "ok", d
          mv = d.get("meta", {}).get("mems_version", "")
          assert mv and mv != "nothing" and mv != "unknown", f"bad mems_version: {mv!r}"
          print(f"bundled :denmark + mems_version ({mv}) ok")
          PY
          run_isolated "$BIN" --quiet data import :denmark -o smoke_denmark.jld2 --format json > /dev/null 2>> "$STDERR_LOG"
          run_isolated "$BIN" --quiet io leontief --format json > wiot_out.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from io leontief:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; d=json.load(open('wiot_out.json')); assert d.get('status')=='ok'; print('bundled :wiot ok')"

          # .jld2 save + irf --plot-save (D3 bundle) + dsge solve + piped repl
          run_isolated "$BIN" --quiet estimate multivariate var smoke.csv --lags 1 --save-model smoke_var.jld2 --format json > /dev/null 2>> "$STDERR_LOG"
          run_isolated "$BIN" --quiet irf var --model smoke_var.jld2 --horizons 4 --ci bootstrap --replications 30 --seed 77 --save-result smoke_irf.jld2 --plot-save smoke_irf.html --format json > irf_out.json 2>> "$STDERR_LOG"
          test -s smoke_irf.html
          # Cross-process storage round-trip smoke (#310): model info, reproduce (.jld2/.jls), convert (.fmod -> .jld2), ARIMA, DSGE, MCP session URIs
          run_isolated "$BIN" --quiet model info smoke_var.jld2 --format json > info_out.json 2>> "$STDERR_LOG"
          python3 -c "import json; d=json.load(open('info_out.json')); assert d.get('status')=='ok'"
          run_isolated "$BIN" --quiet model reproduce smoke_irf.jld2 --format json > repro_out.json 2>> "$STDERR_LOG"
          python3 -c "import json; d=json.load(open('repro_out.json')); m=dict(d['data']['model_reproduce_summary']['rows']); assert m.get('matched')=='true', m; print('reproduce .jld2 ok')"
          run_isolated "$BIN" --quiet model convert smoke_irf.jld2 -o smoke_irf.jls --format json > /dev/null 2>> "$STDERR_LOG"
          run_isolated "$BIN" --quiet model reproduce smoke_irf.jls --format json > repro_jls_out.json 2>> "$STDERR_LOG"
          python3 -c "import json; d=json.load(open('repro_jls_out.json')); m=dict(d['data']['model_reproduce_summary']['rows']); assert m.get('matched')=='true', m; print('reproduce .jls ok')"
          run_isolated "$BIN" --quiet irf var --model smoke_var.jld2 --horizons 4 --save-result smoke_leg.fmod --format json > /dev/null 2>> "$STDERR_LOG"
          run_isolated "$BIN" --quiet model convert smoke_leg.fmod --to jld2 --note "ci-migrated" --format json > /dev/null 2>> "$STDERR_LOG"
          test -s smoke_leg.jld2
          run_isolated "$BIN" --quiet estimate univariate arima smoke.csv --column 1 --p 1 --d 0 --q 0 --save-model smoke_arima.jld2 --format json > /dev/null 2>> "$STDERR_LOG"
          run_isolated "$BIN" --quiet forecast univariate arima --model smoke_arima.jld2 --horizons 4 --format json > arima_fc.json 2>> "$STDERR_LOG"
          python3 -c "import json; assert json.load(open('arima_fc.json')).get('status')=='ok'; print('arima --model ok')"
          run_isolated "$BIN" --quiet dsge solve smoke_rbc.toml --save-model smoke_dsge.jld2 --format json > dsge_out.json 2> step_err.txt
          test ! -s step_err.txt || { echo "Unexpected stderr from dsge solve:"; cat step_err.txt >&2; exit 1; }
          python3 -c "import json; d=json.load(open('dsge_out.json')); assert d.get('status')=='ok'; print('dsge solve ok')"
          run_isolated "$BIN" --quiet model info smoke_dsge.jld2 --format json > dsge_info.json 2>> "$STDERR_LOG"
          python3 -c "import json; assert json.load(open('dsge_info.json')).get('status')=='ok'; print('dsge model info ok')"
          # serve --mcp session URIs (data:// -> model:// -> result://)
          printf '%s\n%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"data_import\",\"arguments\":{\"data\":\"$PWD/smoke.csv\",\"kind\":\"timeseries\",\"output\":\"data://s1\"}}}" \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"estimate_multivariate_var","arguments":{"data":"data://s1","lags":1,"save-model":"model://m1"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"irf_var","arguments":{"model":"model://m1","horizons":4,"save-result":"result://r1"}}}' \
            | run_isolated "$BIN" serve --mcp --quiet > mcp_session_out.jsonl 2>> "$STDERR_LOG"
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("mcp_session_out.jsonl") if l.strip()]
          assert len(lines) == 4, f"expected 4 MCP responses, got {len(lines)}"
          for resp in lines[1:]:
              assert not resp["result"].get("isError", False), resp
          print("serve --mcp session URIs ok")
          PY
          printf -- '--version\nexit\n' | run_isolated "$BIN" repl > repl_out.txt 2>> "$STDERR_LOG"
          echo "piped repl ok"

          # Ensure zero objcache/artifact download chatter across all commands
          if grep -iE 'objcache error|Downloading artifact|Failure artifact' "$STDERR_LOG"; then
            echo "Forbidden runtime stderr detected!" >&2
            exit 1
          fi

          # Exit codes: unknown command -> 2, missing file -> 3
          set +e
          run_isolated "$BIN" nosuchcmd >/dev/null 2>&1
          ec=$?
          set -e
          test "$ec" -eq 2 || { echo "expected exit 2 for unknown command, got $ec"; exit 1; }

          set +e
          run_isolated "$BIN" estimate multivariate var /nope/missing.csv >/dev/null 2>&1
          ec=$?
          set -e
          test "$ec" -eq 3 || { echo "expected exit 3 for missing file, got $ec"; exit 1; }
          echo "exit-code checks ok"

          # Verify zero home mutations and zero files written into depot under default env
          test ! -e "$EMPTY_HOME/.julia" || { echo "Unexpected $EMPTY_HOME/.julia created!"; exit 1; }
          if [ -n "$(find "$EMPTY_DEPOT" -mindepth 1 -print -quit)" ]; then
            echo "Unexpected files written into depot in offline standalone mode:" >&2
            find "$EMPTY_DEPOT" -mindepth 1 >&2
            exit 1
          fi
          echo "zero-write offline depot check ok"

          # Read-only depot (chmod 555) must exit 0 with empty stderr on BOTH fast-path and frdc-core
          chmod 555 "$RO_DEPOT"
          env -i PATH="/usr/bin:/bin" HOME="$EMPTY_HOME" JULIA_DEPOT_PATH="$RO_DEPOT" JULIA_PKG_OFFLINE="true" "$BIN" --version 2> ro_err.txt
          test ! -s ro_err.txt || { echo "Unexpected stderr on read-only depot (fast):"; cat ro_err.txt >&2; exit 1; }
          env -i PATH="/usr/bin:/bin" HOME="$EMPTY_HOME" JULIA_DEPOT_PATH="$RO_DEPOT" JULIA_PKG_OFFLINE="true" FRDC_NO_FASTPATH=1 "$BIN" --version 2> ro_core_err.txt
          test ! -s ro_core_err.txt || { echo "Unexpected stderr on read-only depot (frdc-core):"; cat ro_core_err.txt >&2; exit 1; }
          env -i PATH="/usr/bin:/bin" HOME="$EMPTY_HOME" JULIA_DEPOT_PATH="$RO_DEPOT" JULIA_PKG_OFFLINE="true" "$BIN" --quiet estimate multivariate var smoke.csv --lags 1 --format json > /dev/null
          chmod 755 "$RO_DEPOT"
          echo "read-only depot ok"

      # C074/#79 (W6/#141): latency budgets gate the release on Linux (cold start, min of 3).
      - name: Latency budgets (Linux, offline, enforced)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BENCH_HOME=$(mktemp -d)
          BENCH_DEPOT=$(mktemp -d)
          trap 'rm -rf "$BENCH_HOME" "$BENCH_DEPOT"' EXIT
          env -i \
            PATH="/usr/bin:/bin" \
            HOME="$BENCH_HOME" \
            JULIA_DEPOT_PATH="$BENCH_DEPOT" \
            JULIA_PKG_OFFLINE="true" \
            GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" \
            python3 tools/bench_release.py \
              --bin "$PWD/build/frdc/bin/frdc" \
              --data "$PWD/smoke.csv" \
              --budget-version-ms "$BUDGET_VERSION_MS" \
              --budget-estimate-ms "$BUDGET_ESTIMATE_MS" \
              --enforce

      - name: Smoke-test Windows binary & MSIX AppExecutionAlias (offline, zero-Julia)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Ver = "${{ steps.version.outputs.version }}"
          $Root = (Get-Location).Path
          $Exe = Join-Path $Root "build\frdc\bin\frdc.exe"
          $MsixPath = Join-Path $Root "build\frdc-v$Ver-windows-x86_64.msix"
          $PyExe = (Get-Command python3, python -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $PyExe) { throw "Python not found on PATH" }

          # Verify zero GPL-incompatible solver / proprietary MKL artifacts were bundled (#287, #288)
          $ArtDir = Join-Path $Root "build\frdc\share\julia\artifacts"
          if (Test-Path $ArtDir) {
            $BadArt = Get-ChildItem -Path $ArtDir -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(ipopt|mumps|pathsolver|libpath|libhsl|hsl_jll|mkl|tbb|iomp)' }
            if ($BadArt) {
              throw "GPL-incompatible solver or MKL/oneTBB/IntelOpenMP artifact bundled: $($BadArt[0].FullName)"
            }
          }

          # Helper that captures stdout, stderr, and exit code strictly and rejects
          # objcache / lazy-artifact download errors on stderr.
          function Invoke-Friedman {
            param(
              [string]$FilePath,
              [string[]]$Arguments,
              [int]$ExpectedExit = 0,
              [string]$StdInText = $null,
              [switch]$RequireEmptyStderr
            )
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $FilePath
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.RedirectStandardInput = ($null -ne $StdInText)
            $psi.WorkingDirectory = (Get-Location).Path
            foreach ($a in $Arguments) { [void]$psi.ArgumentList.Add($a) }
            $proc = [System.Diagnostics.Process]::Start($psi)
            if ($null -ne $StdInText) {
              $proc.StandardInput.Write($StdInText)
              $proc.StandardInput.Close()
            }
            $outTask = $proc.StandardOutput.ReadToEndAsync()
            $errTask = $proc.StandardError.ReadToEndAsync()
            $proc.WaitForExit()
            $stdout = $outTask.GetAwaiter().GetResult()
            $stderr = $errTask.GetAwaiter().GetResult()
            $code = $proc.ExitCode
            $cmdStr = "$FilePath $($Arguments -join ' ')"
            if ($code -ne $ExpectedExit) {
              throw "Command '$cmdStr' exited $code (expected $ExpectedExit)`nSTDOUT:`n$stdout`nSTDERR:`n$stderr"
            }
            if ($stderr -match '(?i)objcache error|Downloading artifact|Failure artifact') {
              throw "Forbidden runtime stderr from '$cmdStr':`n$stderr"
            }
            if ($RequireEmptyStderr -and $stderr.Trim().Length -gt 0) {
              throw "Expected empty stderr from '$cmdStr', got:`n$stderr"
            }
            return [pscustomobject]@{ Stdout = $stdout; Stderr = $stderr; ExitCode = $code }
          }

          function Assert-SingleJsonOk {
            param([string]$JsonText, [string]$Label)
            $tmpJson = Join-Path $env:TEMP ("friedman-json-" + [System.Guid]::NewGuid().ToString("N") + ".json")
            try {
              [System.IO.File]::WriteAllText($tmpJson, $JsonText, [System.Text.UTF8Encoding]::new($false))
              & $PyExe -c "import json, sys; raw=open(sys.argv[1], encoding='utf-8').read().strip(); assert raw, 'empty stdout'; dec=json.JSONDecoder(); obj, idx=dec.raw_decode(raw); assert raw[idx:].strip()=='', f'trailing garbage: {raw[idx:]!r}'; assert obj.get('status')=='ok', obj" $tmpJson
              if ($LASTEXITCODE -ne 0) { throw "Strict single-JSON validation failed for $Label" }
            } finally {
              Remove-Item -Path $tmpJson -Force -ErrorAction SilentlyContinue
            }
          }

          # Create fixtures
          $SmokeCsv = Join-Path $Root "smoke.csv"
          $lines = @("y1,y2")
          for ($t = 1; $t -le 60; $t++) {
            $lines += "$t.1,$($t % 7).3"
          }
          [System.IO.File]::WriteAllLines($SmokeCsv, $lines, [System.Text.UTF8Encoding]::new($false))

          $SmokeToml = Join-Path $Root "smoke_rbc.toml"
          $tomlLines = @(
            '[model]',
            'endogenous = ["y", "pi"]',
            'exogenous = ["e_a"]',
            'linear = true',
            '[model.parameters]',
            'rho = 0.85',
            'sigma = 0.02',
            'kappa = 0.25',
            '[[model.equations]]',
            'expr = "y[t] = rho * y[t-1] + sigma * e_a[t]"',
            '[[model.equations]]',
            'expr = "pi[t] = 0.99 * pi[t+1] + kappa * y[t]"'
          )
          [System.IO.File]::WriteAllLines($SmokeToml, $tomlLines, [System.Text.UTF8Encoding]::new($false))

          # Minimal Windows core system PATH (zero julia/juliaup/chocolatey/WindowsApps)
          $CleanPath = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"

          $EmptyDepot = Join-Path $env:TEMP ("friedman-depot-" + [System.Guid]::NewGuid().ToString("N"))
          $CwdAliasDir = Join-Path $env:TEMP ("friedman-alias-cwd-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $EmptyDepot, $CwdAliasDir -Force | Out-Null

          $OrigPath = $env:PATH
          $OrigDepot = $env:JULIA_DEPOT_PATH
          $OrigOffline = $env:JULIA_PKG_OFFLINE
          $OrigObjcache = $env:JULIA_OBJCACHE

          try {
            $env:PATH = $CleanPath
            $env:JULIA_DEPOT_PATH = $EmptyDepot
            $env:JULIA_PKG_OFFLINE = "true"
            # Do NOT set JULIA_OBJCACHE here — verify friedman_driver.c's built-in default!
            Remove-Item Env:JULIA_OBJCACHE -ErrorAction SilentlyContinue

            $RemainingJulia = Get-Command julia -ErrorAction SilentlyContinue
            if ($RemainingJulia) {
              throw "julia is still on PATH after stripping: $($RemainingJulia.Source)"
            }

            # Verify two-binary fastpath layout exists (#296)
            if (-not (Test-Path (Join-Path $Root "build\frdc\bin\frdc-core.exe"))) {
              throw "Missing build\frdc\bin\frdc-core.exe"
            }
            if (-not (Test-Path (Join-Path $Root "build\frdc\share\frdc\cli_cache.bin"))) {
              throw "Missing build\frdc\share\frdc\cli_cache.bin"
            }

            # 1. Direct standalone binary checks (fast-path + FRDC_NO_FASTPATH=1 + zero depot writes)
            $verRes = Invoke-Friedman $Exe @("--version") -RequireEmptyStderr
            if ($verRes.Stdout.Trim() -notmatch [regex]::Escape("frdc v$Ver")) {
              throw "Unexpected --version output: $($verRes.Stdout)"
            }
            Write-Host $verRes.Stdout.Trim()
            $env:FRDC_NO_FASTPATH = "1"
            try {
              $verCore = Invoke-Friedman $Exe @("--version") -RequireEmptyStderr
              if ($verCore.Stdout.Trim() -ne $verRes.Stdout.Trim()) {
                throw "Fast-path vs core --version mismatch: $($verRes.Stdout) != $($verCore.Stdout)"
              }
            } finally {
              Remove-Item Env:FRDC_NO_FASTPATH -ErrorAction SilentlyContinue
            }
            $null = Invoke-Friedman $Exe @("--help") -RequireEmptyStderr
            $docsRes = Invoke-Friedman $Exe @("schema", "--docs") -RequireEmptyStderr
            $docsObj = $docsRes.Stdout | ConvertFrom-Json
            if (-not $docsObj.docs) { throw "schema --docs missing docs payload" }
            $dlRes = Invoke-Friedman $Exe @("data", "list", "--format", "json") -RequireEmptyStderr
            Assert-SingleJsonOk $dlRes.Stdout "direct data list JSON"
            $iosRes = Invoke-Friedman $Exe @("io", "sources", "--format", "json") -RequireEmptyStderr
            Assert-SingleJsonOk $iosRes.Stdout "direct io sources JSON"

            $varRes = Invoke-Friedman $Exe @("--quiet", "estimate", "multivariate", "var", $SmokeCsv, "--lags", "1", "--format", "json")
            Assert-SingleJsonOk $varRes.Stdout "direct VAR JSON"

            $schemaRes = Invoke-Friedman $Exe @("schema", "estimate", "multivariate", "var") -RequireEmptyStderr
            $null = $schemaRes.Stdout | ConvertFrom-Json

            $compRes = Invoke-Friedman $Exe @("completions", "bash") -RequireEmptyStderr
            if (-not $compRes.Stdout.Trim()) { throw "empty completions bash output" }

            $denmarkRes = Invoke-Friedman $Exe @("--quiet", "data", "describe", ":denmark", "--format", "json") -RequireEmptyStderr
            Assert-SingleJsonOk $denmarkRes.Stdout "direct :denmark"
            $denmarkObj = $denmarkRes.Stdout | ConvertFrom-Json
            if (-not $denmarkObj.meta.mems_version -or $denmarkObj.meta.mems_version -in @("nothing", "unknown")) {
              throw "Invalid mems_version: $($denmarkObj.meta.mems_version)"
            }

            $denmarkJld2 = Join-Path $CwdAliasDir "direct_denmark.jld2"
            $null = Invoke-Friedman $Exe @("--quiet", "data", "import", ":denmark", "-o", $denmarkJld2, "--format", "json")
            if (-not (Test-Path $denmarkJld2)) { throw "data import :denmark failed to create .jld2" }

            $wiotRes = Invoke-Friedman $Exe @("--quiet", "io", "leontief", "--format", "json") -RequireEmptyStderr
            Assert-SingleJsonOk $wiotRes.Stdout "direct :wiot"

            $VarJld2 = Join-Path $CwdAliasDir "direct_var.jld2"
            $IrfJld2 = Join-Path $CwdAliasDir "direct_irf.jld2"
            $IrfJls  = Join-Path $CwdAliasDir "direct_irf.jls"
            $IrfFmod = Join-Path $CwdAliasDir "direct_leg.fmod"
            $IrfHtml = Join-Path $CwdAliasDir "direct_irf.html"
            $null = Invoke-Friedman $Exe @("--quiet", "estimate", "multivariate", "var", $SmokeCsv, "--lags", "1", "--save-model", $VarJld2, "--format", "json")
            if (-not (Test-Path $VarJld2)) { throw "save-model .jld2 not created" }
            $irfRes = Invoke-Friedman $Exe @("--quiet", "irf", "var", "--model", $VarJld2, "--horizons", "4", "--ci", "bootstrap", "--replications", "30", "--seed", "77", "--save-result", $IrfJld2, "--plot-save", $IrfHtml, "--format", "json")
            Assert-SingleJsonOk $irfRes.Stdout "direct irf"
            if (-not (Test-Path $IrfHtml) -or (Get-Item $IrfHtml).Length -eq 0) { throw "irf --plot-save empty/missing" }
            $infoRes = Invoke-Friedman $Exe @("--quiet", "model", "info", $VarJld2, "--format", "json")
            Assert-SingleJsonOk $infoRes.Stdout "direct model info"
            $reproRes = Invoke-Friedman $Exe @("--quiet", "model", "reproduce", $IrfJld2, "--format", "json")
            Assert-SingleJsonOk $reproRes.Stdout "direct model reproduce .jld2"
            $null = Invoke-Friedman $Exe @("--quiet", "model", "convert", $IrfJld2, "-o", $IrfJls, "--format", "json")
            $reproJlsRes = Invoke-Friedman $Exe @("--quiet", "model", "reproduce", $IrfJls, "--format", "json")
            Assert-SingleJsonOk $reproJlsRes.Stdout "direct model reproduce .jls"
            $null = Invoke-Friedman $Exe @("--quiet", "irf", "var", "--model", $VarJld2, "--horizons", "4", "--save-result", $IrfFmod, "--format", "json")
            $null = Invoke-Friedman $Exe @("--quiet", "model", "convert", $IrfFmod, "--to", "jld2", "--format", "json")
            if (-not (Test-Path (Join-Path $CwdAliasDir "direct_leg.jld2"))) { throw "model convert .fmod -> .jld2 failed" }

            $DsgeJld2 = Join-Path $CwdAliasDir "direct_dsge.jld2"
            $dsgeRes = Invoke-Friedman $Exe @("--quiet", "dsge", "solve", $SmokeToml, "--save-model", $DsgeJld2, "--format", "json") -RequireEmptyStderr
            Assert-SingleJsonOk $dsgeRes.Stdout "direct dsge solve"
            $dsgeInfo = Invoke-Friedman $Exe @("--quiet", "model", "info", $DsgeJld2, "--format", "json")
            Assert-SingleJsonOk $dsgeInfo.Stdout "direct dsge model info"

            $csvJson = $SmokeCsv.Replace("\", "\\")
            $mcpInput = (@(
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}',
              "{`"jsonrpc`":`"2.0`",`"id`":2,`"method`":`"tools/call`",`"params`":{`"name`":`"data_import`",`"arguments`":{`"data`":`"$csvJson`",`"kind`":`"timeseries`",`"output`":`"data://w1`"}}}",
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"estimate_multivariate_var","arguments":{"data":"data://w1","lags":1,"save-model":"model://wm1"}}}',
              '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"irf_var","arguments":{"model":"model://wm1","horizons":4,"save-result":"result://wr1"}}}'
            ) -join "`n") + "`n"
            $mcpRes = Invoke-Friedman $Exe @("serve", "--mcp", "--quiet") -StdInText $mcpInput
            $mcpLines = @($mcpRes.Stdout.Split("`n") | Where-Object { $_.Trim().Length -gt 0 })
            if ($mcpLines.Count -ne 4) { throw "Expected 4 MCP responses, got $($mcpLines.Count)" }
            for ($mi = 1; $mi -lt 4; $mi++) {
              $mobj = $mcpLines[$mi] | ConvertFrom-Json
              if ($mobj.result.isError) { throw "MCP session URI call $($mi+1) returned isError: $($mcpLines[$mi])" }
            }

            $null = Invoke-Friedman $Exe @("repl") -StdInText "--version`nexit`n"
            $null = Invoke-Friedman $Exe @("nosuchcmd") -ExpectedExit 2
            $null = Invoke-Friedman $Exe @("estimate", "multivariate", "var", "C:\nope\missing.csv") -ExpectedExit 3

            $Written = Get-ChildItem -Path $EmptyDepot -Recurse -Force -ErrorAction SilentlyContinue
            if ($Written) {
              throw "Standalone binary wrote files into depot under default env: $(($Written | Select-Object -ExpandProperty FullName) -join ', ')"
            }
            Write-Host "Direct standalone Windows binary smoke tests passed (zero stderr errors, zero depot writes)."

            # 2. Install sideload MSIX & verify AppExecutionAlias + read-only WindowsApps + caller CWD
            $DevKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
            if (-not (Test-Path $DevKey)) { New-Item -Path $DevKey -Force | Out-Null }
            Set-ItemProperty -Path $DevKey -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord
            powershell.exe -NoProfile -Command "`$ErrorActionPreference = 'Stop'; Add-AppxPackage -Path '$MsixPath' -AllowUnsigned"
            if ($LASTEXITCODE -ne 0) { throw "Add-AppxPackage -AllowUnsigned failed with exit code $LASTEXITCODE" }

            $AliasExe = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\frdc.exe"
            if (-not (Test-Path $AliasExe)) {
              throw "AppExecutionAlias not created at $AliasExe"
            }

            # Run alias tests with empty JULIA_DEPOT_PATH and unset JULIA_OBJCACHE
            # against the read-only WindowsApps package root: must emit ZERO objcache errors!
            $env:JULIA_DEPOT_PATH = ""
            Remove-Item Env:JULIA_OBJCACHE -ErrorAction SilentlyContinue

            Copy-Item $SmokeCsv (Join-Path $CwdAliasDir "smoke.csv")
            Copy-Item $SmokeToml (Join-Path $CwdAliasDir "smoke_rbc.toml")

            Push-Location $CwdAliasDir
            try {
              $aliasVer = Invoke-Friedman $AliasExe @("--version") -RequireEmptyStderr
              if ($aliasVer.Stdout.Trim() -notmatch [regex]::Escape("frdc v$Ver")) {
                throw "Unexpected Alias --version output: $($aliasVer.Stdout)"
              }
              Write-Host "Alias: $($aliasVer.Stdout.Trim())"
              $env:FRDC_NO_FASTPATH = "1"
              try {
                $aliasCoreVer = Invoke-Friedman $AliasExe @("--version") -RequireEmptyStderr
                if ($aliasCoreVer.Stdout.Trim() -ne $aliasVer.Stdout.Trim()) {
                  throw "Alias fast-path vs core --version mismatch"
                }
              } finally {
                Remove-Item Env:FRDC_NO_FASTPATH -ErrorAction SilentlyContinue
              }
              $null = Invoke-Friedman $AliasExe @("--help") -RequireEmptyStderr
              $null = (Invoke-Friedman $AliasExe @("schema", "--docs") -RequireEmptyStderr).Stdout | ConvertFrom-Json
              $null = Invoke-Friedman $AliasExe @("completions", "bash") -RequireEmptyStderr
              Assert-SingleJsonOk (Invoke-Friedman $AliasExe @("data", "list", "--format", "json") -RequireEmptyStderr).Stdout "alias data list JSON"
              Assert-SingleJsonOk (Invoke-Friedman $AliasExe @("io", "sources", "--format", "json") -RequireEmptyStderr).Stdout "alias io sources JSON"

              $null = Invoke-Friedman $AliasExe @("--quiet", "estimate", "multivariate", "var", ".\smoke.csv", "--lags", "1", "--format", "json", "--output", ".\alias_out.json", "--save-model", ".\alias_var.jld2")
              if (-not (Test-Path ".\alias_out.json") -or -not (Test-Path ".\alias_var.jld2")) {
                throw "Alias relative output/save-model files not created in caller CWD!"
              }
              Assert-SingleJsonOk ([System.IO.File]::ReadAllText((Resolve-Path ".\alias_out.json").Path)) "alias VAR JSON -o"

              $aliasIrf = Invoke-Friedman $AliasExe @("--quiet", "irf", "var", "--model", ".\alias_var.jld2", "--horizons", "4", "--plot-save", ".\alias_irf.html", "--format", "json")
              Assert-SingleJsonOk $aliasIrf.Stdout "alias irf"
              if (-not (Test-Path ".\alias_irf.html") -or (Get-Item ".\alias_irf.html").Length -eq 0) {
                throw "Alias irf --plot-save empty/missing"
              }

              $aliasDenmark = Invoke-Friedman $AliasExe @("--quiet", "data", "describe", ":denmark", "--format", "json") -RequireEmptyStderr
              Assert-SingleJsonOk $aliasDenmark.Stdout "alias :denmark"

              $aliasDsge = Invoke-Friedman $AliasExe @("--quiet", "dsge", "solve", ".\smoke_rbc.toml", "--format", "json") -RequireEmptyStderr
              Assert-SingleJsonOk $aliasDsge.Stdout "alias dsge solve"

              $null = Invoke-Friedman $AliasExe @("repl") -StdInText "--version`nexit`n"
              $null = Invoke-Friedman $AliasExe @("nosuchcmd") -ExpectedExit 2
              $null = Invoke-Friedman $AliasExe @("estimate", "multivariate", "var", ".\missing.csv") -ExpectedExit 3
            } finally {
              Pop-Location
            }
            Write-Host "MSIX AppExecutionAlias + CWD smoke tests passed (zero objcache/stderr errors)."
          } finally {
            powershell.exe -NoProfile -Command "Get-AppxPackage -Name 'FriedmanJP.Friedman-cli' -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue"
            $env:PATH = $OrigPath
            $env:JULIA_DEPOT_PATH = $OrigDepot
            $env:JULIA_PKG_OFFLINE = $OrigOffline
            $env:JULIA_OBJCACHE = $OrigObjcache
            Remove-Item -Path $EmptyDepot, $CwdAliasDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Latency report (Windows, offline, report-only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PyExe = (Get-Command python3, python -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $PyExe) { throw "Python not found on PATH" }
          $CleanPath = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $OrigPath = $env:PATH
          $OrigDepot = $env:JULIA_DEPOT_PATH
          $OrigOffline = $env:JULIA_PKG_OFFLINE
          try {
            $env:PATH = $CleanPath
            $env:JULIA_DEPOT_PATH = ""
            $env:JULIA_PKG_OFFLINE = "true"
            & $PyExe tools/bench_release.py `
              --bin "build/frdc/bin/frdc.exe" `
              --data "smoke.csv" `
              --budget-version-ms "$env:BUDGET_VERSION_MS" `
              --budget-estimate-ms "$env:BUDGET_ESTIMATE_MS"
            if ($LASTEXITCODE -ne 0) { throw "bench_release.py failed with exit code $LASTEXITCODE" }
          } finally {
            $env:PATH = $OrigPath
            $env:JULIA_DEPOT_PATH = $OrigDepot
            $env:JULIA_PKG_OFFLINE = $OrigOffline
          }

      - name: Upload Store MSIX workflow artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-msix-windows-x86_64
          path: build/frdc-v${{ steps.version.outputs.version }}-windows-x86_64-store.msix

      - name: Archive (tar.gz)
        if: startsWith(github.ref, 'refs/tags/') && matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd build
          tar -czf frdc-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz frdc/

      - name: Archive (zip)
        if: startsWith(github.ref, 'refs/tags/') && matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path frdc -DestinationPath "frdc-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Upload Linux release artifact
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frdc-${{ matrix.platform }}
          path: build/frdc-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

      - name: Upload Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frdc-${{ matrix.platform }}
          path: |
            build/frdc-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
            build/frdc-v${{ steps.version.outputs.version }}-windows-x86_64.msix

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: frdc-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            install.sh
            install.ps1
