name: Release

on:
  push:
    tags:
      - 'v*'
  # W6/#141 (C074/#79): dispatch runs build + smoke + latency bench WITHOUT
  # releasing (the release job and archive/upload steps are tag-guarded).
  # The budget inputs exist for the documented failure-path demonstration —
  # never lower budgets to make a red run green.
  workflow_dispatch:
    inputs:
      budget_version_ms:
        description: "--version budget in ms (default 3000)"
        required: false
        default: "3000"
      budget_estimate_ms:
        description: "first estimate var budget in ms (default 3500)"
        required: false
        default: "3500"

permissions:
  contents: write

env:
  BUDGET_VERSION_MS: ${{ github.event.inputs.budget_version_ms || '3000' }}
  BUDGET_ESTIMATE_MS: ${{ github.event.inputs.budget_estimate_ms || '3500' }}

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 0.7.0 line bundles JuMP+Ipopt into the sysimage (C060), pushing the ubuntu
    # build past the old 90/60 caps. Headroom for setup+deps+build+archive+upload.
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            arch: arm64
            platform: darwin-arm64
            archive_ext: tar.gz
          - os: ubuntu-latest
            arch: x64
            platform: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            arch: x64
            platform: windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.12'
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2

      - name: Install dependencies
        run: |
          # Registry MacroEconometricModels pinned =0.7.0 via [compat]
          julia --project -e 'using Pkg; Pkg.instantiate()'

      # PackageCompiler building the JuMP+Ipopt-bundled sysimage (0.7.0 line, C060)
      # OOM-kills the ~7 GB ubuntu runner. Give it swap headroom so peak memory
      # spills to disk instead of terminating the runner. Linux-only (fallocate).
      - name: Add swap space (Linux OOM headroom)
        if: runner.os == 'Linux'
        run: |
          # GitHub ubuntu runners already have an active /swapfile (fallocate over it
          # fails "Text file busy"), so add ADDITIONAL swap on the large /mnt temp disk.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h

      - name: Build sysimage
        run: julia build_release.jl
        timeout-minutes: 120

      - name: Smoke-test binary (C034 hard JSON + schema + exit codes)
        shell: bash
        run: |
          set -euo pipefail
          BIN=build/friedman/bin/friedman
          [ "$RUNNER_OS" = "Windows" ] && BIN=build/friedman/bin/friedman.cmd

          # --version / --help
          "$BIN" --version
          "$BIN" --help > /dev/null

          # Fixture
          printf 'y1,y2\n' > smoke.csv
          for t in $(seq 1 60); do printf '%s,%s\n' "$t.1" "$((t % 7)).3" >> smoke.csv; done

          # Hard gate: exactly one JSON document (no ::warning fallback)
          "$BIN" --quiet estimate var smoke.csv --lags 1 --format json > smoke_out.json
          python3 - <<'PY'
          import json, sys
          raw = open("smoke_out.json").read().strip()
          assert raw, "empty stdout"
          json.loads(raw)  # raises if not valid JSON or trailing garbage with strict loads
          # ensure single top-level value: re-parse and check no multi-doc
          decoder = json.JSONDecoder()
          obj, idx = decoder.raw_decode(raw)
          assert raw[idx:].strip() == "", f"trailing garbage after JSON: {raw[idx:]!r}"
          assert obj.get("status") == "ok" or obj.get("schema_version") == 1
          print("json hard gate ok")
          PY

          # schema command → valid JSON
          "$BIN" schema estimate var > schema_out.json
          python3 -c "import json; json.load(open('schema_out.json')); print('schema json ok')"

          # exit codes: unknown command → 2, missing file → 3
          set +e
          "$BIN" nosuchcmd >/dev/null 2>&1
          ec=$?
          set -e
          test "$ec" -eq 2 || { echo "expected exit 2 for unknown command, got $ec"; exit 1; }

          set +e
          "$BIN" estimate var /nope/missing.csv >/dev/null 2>&1
          ec=$?
          set -e
          test "$ec" -eq 3 || { echo "expected exit 3 for missing file, got $ec"; exit 1; }
          echo "exit-code checks ok"

      # C074/#79 (W6/#141): latency budgets gate the release. Cold process
      # start is the metric (min of 3 cold runs). Enforced on ubuntu; macOS
      # and Windows report to the job summary only (runner variance). A real
      # breach is fixed by expanding the build_release.jl precompile workload
      # — budgets are never relaxed.
      - name: Latency budgets (C074/#79)
        shell: bash
        run: |
          BIN=build/friedman/bin/friedman
          [ "$RUNNER_OS" = "Windows" ] && BIN=build/friedman/bin/friedman.cmd
          ENFORCE=""
          [ "$RUNNER_OS" = "Linux" ] && ENFORCE="--enforce"
          python3 tools/bench_release.py --bin "$BIN" --data smoke.csv \
            --budget-version-ms "$BUDGET_VERSION_MS" \
            --budget-estimate-ms "$BUDGET_ESTIMATE_MS" \
            $ENFORCE

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Archive (tar.gz)
        if: startsWith(github.ref, 'refs/tags/') && matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd build
          tar -czf friedman-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz friedman/

      - name: Archive (zip)
        if: startsWith(github.ref, 'refs/tags/') && matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path friedman -DestinationPath "friedman-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: friedman-${{ matrix.platform }}
          path: build/friedman-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            install.sh
            install.ps1
