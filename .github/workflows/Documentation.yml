name: Documentation

on:
  push:
    branches: [master, dev]
    tags: ["*"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install MacroEconometricModels from GitHub
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="2b65092421a89df34cb82c773b36117dcda11553")
            Pkg.develop(path=".")
            Pkg.instantiate()
          '
      - name: Regenerate CLI reference (stale check)
        run: |
          julia --project -e '
            using Pkg
            Pkg.rm("MacroEconometricModels")
            Pkg.add(url="https://github.com/FriedmanJP/MacroEconometricModels.jl.git", rev="2b65092421a89df34cb82c773b36117dcda11553")
            Pkg.instantiate()
          '
          julia --project docs/generate_cli_reference.jl --check
          julia --project docs/capture_examples.jl --check
      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # deploydocs only pushes from master (D-9); build still runs on dev
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
