name: Documentation

on:
  push:
    branches: [master, dev]
    tags: ["*"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# master pushes deploy the dev docs and tag pushes deploy the version dirs — at
# release time both fire on the same commit and race on the gh-pages push (the
# loser dies with "! [rejected] ... fetch first", which is how the v0.9.2 master
# run failed). Deploying refs share ONE queued group; PR/dev builds keep per-ref
# cancellation.
concurrency:
  group: docs-${{ (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) && 'deploy' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
          '
      - name: Regenerate CLI reference (stale check)
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project docs/generate_cli_reference.jl --check
          julia --project docs/capture_examples.jl --check
      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          # Deploy over HTTPS with the built-in GITHUB_TOKEN (permissions: contents: write
          # above grant push to gh-pages). The SSH DOCUMENTER_KEY deploy key failed auth on
          # the first real deploy — the v0.6.0 release tag — with "Could not read from remote
          # repository" (git@github.com fetch → exit 128). deploydocs still only deploys from
          # master (devbranch) + release tags; dev pushes build without deploying.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
